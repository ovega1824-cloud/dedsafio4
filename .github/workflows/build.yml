name: Compilar mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar el .jar
        run: gradle build --no-daemon

      - name: Guardar el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: desafio4-jar
          path: build/libs/desafio4-*.jar

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Desafio 4 - build ${{ github.run_number }}
          body: Descarga el archivo desafio4-1.0.0.jar y ponlo en la carpeta mods de Forge 1.20.1.
          files: build/libs/desafio4-1.0.0.jar
